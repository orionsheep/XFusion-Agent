services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      XFUSION_DATABASE_URL: sqlite:////app/backend/xfusion.db
      XFUSION_SECRET_KEY: local-dev-secret
      XFUSION_FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  node-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "9001:9001"
    volumes:
      - ./agent:/app/agent

volumes:
  frontend_node_modules:
